name: bIDE Phase 2 Checkpoint Observer

on:
  push:
    branches:
      - agent/bide-ios-phase2-data-sql
    paths:
      - ".github/workflows/bide-phase2-checkpoint-observer.yml"

permissions:
  actions: read
  contents: write

jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET_SHA: fdfa8f119729a264645a23bfbd21b62848176ddf
      STATUS_FILE: .github/bide-phase2-checkpoint-status.json
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/bide-ios-phase2-data-sql

      - name: Wait for native checkpoint
        shell: bash
        run: |
          set -euo pipefail
          run_json=""
          for _ in $(seq 1 90); do
            runs="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${TARGET_SHA}&event=push&per_page=20")"
            run_json="$(printf '%s' "${runs}" | jq -c '[.workflow_runs[] | select(.name == "bIDE iOS Quality")][0] // empty')"
            if [[ -n "${run_json}" ]]; then
              status="$(printf '%s' "${run_json}" | jq -r '.status')"
              if [[ "${status}" == "completed" ]]; then
                break
              fi
            fi
            sleep 10
          done

          if [[ -z "${run_json}" ]]; then
            echo "Native checkpoint run was not found." >&2
            exit 1
          fi

          status="$(printf '%s' "${run_json}" | jq -r '.status')"
          if [[ "${status}" != "completed" ]]; then
            echo "Native checkpoint did not complete before observer timeout." >&2
            exit 1
          fi

          mkdir -p .github
          printf '%s' "${run_json}" | jq '{run_id: .id, run_number: .run_number, status: .status, conclusion: .conclusion, html_url: .html_url, head_sha: .head_sha, event: .event, created_at: .created_at, updated_at: .updated_at}' > "${STATUS_FILE}"

      - name: Publish checkpoint status
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${STATUS_FILE}"
          git commit -m "Record Phase 2 checkpoint status"
          git push origin HEAD:agent/bide-ios-phase2-data-sql
