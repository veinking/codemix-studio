name: bIDE Phase 2 Checkpoint Observer

on:
  push:
    branches:
      - agent/bide-ios-phase2-data-sql
    paths:
      - ".github/workflows/bide-phase2-checkpoint-observer.yml"

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      STATUS_FILE: .github/bide-phase2-scope-scan.txt
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/bide-ios-phase2-data-sql

      - name: Scan native Swift scope literals
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .github
          {
            echo "WKWebView matches:"
            grep -RIn --include='*.swift' 'WKWebView' ios/BideApp || true
            echo
            echo "Other deferred-runtime matches:"
            grep -RIn --include='*.swift' -E 'Pyodide|webR|import StoreKit|import Supabase' ios/BideApp || true
          } > "${STATUS_FILE}"
          cat "${STATUS_FILE}"

      - name: Publish diagnostic
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${STATUS_FILE}"
          git commit -m "Record Phase 2 scope scan"
          git push origin HEAD:agent/bide-ios-phase2-data-sql
