name: Apply R Runtime Audit

on:
  push:
    branches: [agent/bide-r-runtime-audit]

permissions:
  contents: write

jobs:
  patch-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply R runtime audit patch
        run: python scripts/run-r-runtime-audit-patch.py
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit -p tsconfig.app.json
      - name: R runtime regression guard
        run: npm run test:r-runtime
      - name: Production build
        run: npm run build
      - name: Commit verified patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Harden bIDE R runtime workflows"
          git push origin HEAD:${GITHUB_REF_NAME}
