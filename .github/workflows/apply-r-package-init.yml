name: Apply R Package Init Fix

on:
  push:
    branches: [agent/bide-r-runtime-audit]

permissions:
  contents: write

jobs:
  patch-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply package initialization fix
        run: python scripts/apply-r-package-init.py
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit -p tsconfig.app.json
      - name: R runtime regression guard
        run: npm run test:r-runtime
      - name: Production build
        run: npm run build
      - name: Commit verified fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Initialize runtimes before package installs"
          git push origin HEAD:${GITHUB_REF_NAME}
