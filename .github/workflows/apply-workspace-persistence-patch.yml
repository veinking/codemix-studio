name: Apply workspace persistence patch

on:
  push:
    branches:
      - "agent/bide-workspace-persistence-audit"
    paths:
      - ".github/workflows/apply-workspace-persistence-patch.yml"
      - "scripts/apply-workspace-persistence-patch.py"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: "agent/bide-workspace-persistence-audit"
      - name: Apply guarded workspace patch
        run: python3 scripts/apply-workspace-persistence-patch.py
      - name: Commit patch
        run: |
          if git diff --quiet; then
            echo "No patch needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/IDE.tsx src/integrations/supabase/types.ts
          git commit -m "Persist restored cloud workspaces locally"
          git push origin HEAD:agent/bide-workspace-persistence-audit
