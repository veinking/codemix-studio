name: Apply share client hardening

on:
  push:
    branches: [agent/bide-share-hardening]
    paths:
      - '.github/workflows/apply-share-client-hardening.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/bide-share-hardening
      - name: Apply guarded client patch
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # Generated Supabase types predate the new RPCs; isolate the cast until
          # the next full schema type regeneration rather than weakening the client.
          for path in [Path('src/components/ShareDialog.tsx'), Path('src/pages/SharedCode.tsx')]:
              text = path.read_text()
              text = text.replace("supabase.rpc('create_shared_code'", "(supabase.rpc as any)('create_shared_code'")
              text = text.replace("supabase.rpc('get_shared_code'", "(supabase.rpc as any)('get_shared_code'")
              path.write_text(text)

          ide = Path('src/pages/IDE.tsx')
          text = ide.read_text()
          old = '''  // Handle URL parameters for "Open in IDE" from docs
          useEffect(() => {
            const params = new URLSearchParams(window.location.search);
            const codeParam = params.get('code');
            const langParam = params.get('lang');
            
            if (codeParam && langParam) {
              try {
                const decodedCode = atob(codeParam);
                const validLang = ['python', 'r', 'javascript', 'sql'].includes(langParam) 
                  ? langParam as 'python' | 'r' | 'javascript' | 'sql'
                  : 'python';
                
                setScratchCode(decodedCode);
                setScratchLanguage(validLang);
                setLanguageCode(prev => ({
                  ...prev,
                  [validLang]: decodedCode
                }));
                
                // Clear URL params
                window.history.replaceState({}, '', '/ide');
                
                toast.success('Code loaded from documentation!');
              } catch (e) {
                console.error('Failed to decode code from URL:', e);
              }
            }
          }, []);'''
          new = '''  // Handle one-time editor handoffs from shared links and documentation.
          useEffect(() => {
            const params = new URLSearchParams(window.location.search);

            if (params.get('shared') === 'fork') {
              const sharedCode = sessionStorage.getItem('bide_shared_fork_code');
              const sharedLanguage = sessionStorage.getItem('bide_shared_fork_language');
              const validSharedLanguage = sharedLanguage && ['python', 'r', 'javascript', 'sql'].includes(sharedLanguage)
                ? sharedLanguage as 'python' | 'r' | 'javascript' | 'sql'
                : null;

              if (sharedCode !== null && validSharedLanguage) {
                setActiveFile(null);
                setShowDataset(null);
                setScratchCode(sharedCode);
                setScratchLanguage(validSharedLanguage);
                setLanguageCode(prev => ({
                  ...prev,
                  [validSharedLanguage]: sharedCode,
                }));
                sessionStorage.removeItem('bide_shared_fork_code');
                sessionStorage.removeItem('bide_shared_fork_language');
                window.history.replaceState({}, '', '/ide');
                toast.success('Shared code loaded into the editor');
                return;
              }

              sessionStorage.removeItem('bide_shared_fork_code');
              sessionStorage.removeItem('bide_shared_fork_language');
              window.history.replaceState({}, '', '/ide');
              toast.error('Shared code handoff expired. Open the share link again.');
              return;
            }

            const codeParam = params.get('code');
            const langParam = params.get('lang');
            
            if (codeParam && langParam) {
              try {
                const decodedCode = atob(codeParam);
                const validLang = ['python', 'r', 'javascript', 'sql'].includes(langParam) 
                  ? langParam as 'python' | 'r' | 'javascript' | 'sql'
                  : 'python';
                
                setScratchCode(decodedCode);
                setScratchLanguage(validLang);
                setLanguageCode(prev => ({
                  ...prev,
                  [validLang]: decodedCode
                }));
                window.history.replaceState({}, '', '/ide');
                toast.success('Code loaded from documentation!');
              } catch (e) {
                console.error('Failed to decode code from URL:', e);
              }
            }
          }, []);'''
          if old not in text:
              raise SystemExit('IDE handoff block drifted; refusing partial patch')
          ide.write_text(text.replace(old, new, 1))
          PY
      - name: Commit patch
        run: |
          if git diff --quiet; then
            echo "No patch needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/ShareDialog.tsx src/pages/SharedCode.tsx src/pages/IDE.tsx
          git commit -m "Wire hardened share RPC client"
          git push origin HEAD:agent/bide-share-hardening
