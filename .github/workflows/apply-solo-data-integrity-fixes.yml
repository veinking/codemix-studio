name: Apply solo data-integrity fixes

on:
  push:
    branches:
      - agent/bide-solo-data-integrity-audit

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/bide-solo-data-integrity-audit
          fetch-depth: 0
      - name: Apply guarded source patch
        run: python scripts/apply-solo-data-integrity-fixes.py
      - name: Remove temporary patch machinery
        run: |
          git rm scripts/apply-solo-data-integrity-fixes.py
          git rm .github/workflows/apply-solo-data-integrity-fixes.yml
      - name: Commit patched IDE
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/IDE.tsx
          git commit -m "Fix solo workflow persistence and CSV integrity"
          git push origin HEAD:agent/bide-solo-data-integrity-audit
