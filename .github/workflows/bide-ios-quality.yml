name: bIDE iOS Quality

# EXPENSIVE CHECKPOINT LANE.
# This workflow is manual-only by design. Do not attach push, pull_request,
# ready_for_review, or schedule triggers here. During active development we batch
# fixes, run the cheap source preflight once, and dispatch this macOS/Xcode lane
# only when the resulting IPA is worth installing on a physical device.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bide-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Validate Phase 1 baseline
        run: node scripts/validate-bide-ios-phase1.mjs

      - name: Validate Phase 2 data + SQL
        run: node scripts/validate-bide-ios-phase2.mjs

      - name: Validate Python and R runtime wiring
        run: node scripts/validate-bide-ios-runtimes.mjs

      - name: Select Xcode 16.4
        shell: bash
        run: |
          set -euo pipefail
          XCODE_PATH="/Applications/Xcode_16.4.app/Contents/Developer"
          test -d "${XCODE_PATH}"
          sudo xcode-select --switch "${XCODE_PATH}"
          xcodebuild -version

      - name: Install XcodeGen
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          xcodegen --version

      - name: Generate project and bundled runtimes
        working-directory: ios
        run: xcodegen generate

      - name: Build iPhone/iPad simulator target
        shell: bash
        run: |
          set -o pipefail
          xcodebuild \
            -project ios/bIDE.xcodeproj \
            -scheme bIDE \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build | tee /tmp/bide-ios-build.log

      - name: Run native join/export regressions
        shell: bash
        run: |
          set -euo pipefail
          DEVICE_ID="$(xcrun simctl list devices available -j | python3 -c 'import json,sys; data=json.load(sys.stdin); ids=[d["udid"] for runtime in data["devices"].values() for d in runtime if d.get("isAvailable") and d.get("name","").startswith("iPhone")]; print(ids[0] if ids else "")')"
          test -n "${DEVICE_ID}"
          set -o pipefail
          xcodebuild \
            -project ios/bIDE.xcodeproj \
            -scheme bIDE \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "platform=iOS Simulator,id=${DEVICE_ID}" \
            CODE_SIGNING_ALLOWED=NO \
            test | tee /tmp/bide-ios-tests.log

      - name: Build unsigned physical-device IPA
        shell: bash
        run: bash scripts/release/build_bide_sideloadly_ipa.sh

      - name: Upload bIDE physical-device package
        uses: actions/upload-artifact@v4
        with:
          name: bIDE-Phase3-Runtimes-${{ github.run_attempt }}
          path: |
            build/bIDE-Sideloadly.ipa
            build/BideSideloadlyLogs/
          retention-days: 7
          if-no-files-found: error

      - name: Upload simulator build diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: bide-ios-phase3-build-diagnostics
          path: |
            /tmp/bide-ios-build.log
            /tmp/bide-ios-tests.log
            build/BideSideloadlyLogs/
          retention-days: 7
          if-no-files-found: warn
