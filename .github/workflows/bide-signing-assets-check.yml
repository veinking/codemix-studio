name: bIDE Signing Assets Check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-signing-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      IOS_DISTRIBUTION_CERTIFICATE_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_BASE64 }}
      IOS_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
      BIDE_IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.BIDE_IOS_PROVISIONING_PROFILE_BASE64 }}
    steps:
      - name: Validate required signing secrets exist
        shell: bash
        run: |
          set -euo pipefail
          for variable in APPLE_TEAM_ID IOS_DISTRIBUTION_CERTIFICATE_BASE64 IOS_DISTRIBUTION_CERTIFICATE_PASSWORD BIDE_IOS_PROVISIONING_PROFILE_BASE64; do
            if [[ -z "${!variable:-}" ]]; then
              echo "Missing required Actions secret: ${variable}" >&2
              exit 1
            fi
          done

      - name: Decode signing assets strictly
        shell: bash
        run: |
          set -euo pipefail
          export CERT_PATH="${RUNNER_TEMP}/bIDE_Distribution.p12"
          export PROFILE_PATH="${RUNNER_TEMP}/bIDE_App_Store.mobileprovision"
          python3 - <<'PY'
          import base64, os
          from pathlib import Path

          def decode_secret(name, path):
              raw = os.environ[name]
              compact = ''.join(raw.split())
              try:
                  data = base64.b64decode(compact, validate=True)
              except Exception as exc:
                  raise SystemExit(f"{name} is not valid base64: {exc}")
              if len(data) < 100:
                  raise SystemExit(f"{name} decoded to an unexpectedly small file ({len(data)} bytes)")
              Path(path).write_bytes(data)
              print(f"{name}: decoded {len(data)} bytes")

          decode_secret('IOS_DISTRIBUTION_CERTIFICATE_BASE64', os.environ['CERT_PATH'])
          decode_secret('BIDE_IOS_PROVISIONING_PROFILE_BASE64', os.environ['PROFILE_PATH'])
          PY

      - name: Validate distribution certificate and password
        shell: bash
        run: |
          set -euo pipefail
          CERT="${RUNNER_TEMP}/bIDE_Distribution.p12"
          OUT="${RUNNER_TEMP}/distribution-cert.pem"
          ERR="${RUNNER_TEMP}/pkcs12-error.txt"

          if openssl pkcs12 \
            -in "${CERT}" \
            -passin env:IOS_DISTRIBUTION_CERTIFICATE_PASSWORD \
            -clcerts -nokeys \
            -out "${OUT}" 2>"${ERR}"; then
            MODE="modern"
          elif openssl pkcs12 -legacy \
            -in "${CERT}" \
            -passin env:IOS_DISTRIBUTION_CERTIFICATE_PASSWORD \
            -clcerts -nokeys \
            -out "${OUT}" 2>"${ERR}"; then
            MODE="legacy"
          else
            echo "Distribution certificate could not be opened with the configured password." >&2
            echo "OpenSSL diagnostic:" >&2
            sed -E 's/(pass(word)?|secret|key)[^ ]*/[redacted]/Ig' "${ERR}" >&2 || true
            exit 1
          fi

          openssl x509 -in "${OUT}" -noout -subject -issuer -dates
          openssl x509 -in "${OUT}" -outform DER -out "${RUNNER_TEMP}/distribution-cert.der"
          echo "Distribution certificate/password: valid (${MODE} PKCS#12 mode)"

      - name: Validate provisioning profile and certificate binding
        shell: bash
        run: |
          set -euo pipefail
          PROFILE="${RUNNER_TEMP}/bIDE_App_Store.mobileprovision"
          PROFILE_PLIST="${RUNNER_TEMP}/bIDE_App_Store.plist"
          openssl asn1parse -inform DER -in "${PROFILE}" -noout
          openssl smime -inform DER -verify -noverify -in "${PROFILE}" -out "${PROFILE_PLIST}" >/dev/null 2>&1
          export PROFILE_PLIST
          export CERT_DER="${RUNNER_TEMP}/distribution-cert.der"
          python3 - <<'PY'
          import hashlib
          import os
          import plistlib
          from pathlib import Path

          profile = plistlib.loads(Path(os.environ['PROFILE_PLIST']).read_bytes())
          team_ids = profile.get('TeamIdentifier') or []
          app_id = (profile.get('Entitlements') or {}).get('application-identifier')
          print('Provisioning profile TeamIdentifier:', ', '.join(team_ids) if team_ids else '<missing>')
          print('Provisioning profile application-identifier:', app_id or '<missing>')

          if team_ids != [os.environ['APPLE_TEAM_ID']]:
              raise SystemExit('Provisioning profile TeamIdentifier does not match APPLE_TEAM_ID.')

          expected_app_id = f"{os.environ['APPLE_TEAM_ID']}.com.bideide.ios"
          if app_id != expected_app_id:
              raise SystemExit('Provisioning profile application-identifier does not match com.bideide.ios.')

          cert = Path(os.environ['CERT_DER']).read_bytes()
          embedded = [bytes(item) for item in profile.get('DeveloperCertificates', [])]
          if cert not in embedded:
              fingerprint = hashlib.sha256(cert).hexdigest().upper()
              raise SystemExit(
                  'The distribution certificate in IOS_DISTRIBUTION_CERTIFICATE_BASE64 is not embedded in '
                  'the bIDE provisioning profile. Regenerate/download the bIDE App Store profile with this '
                  f'certificate selected. Certificate SHA-256: {fingerprint}'
              )

          print('Provisioning profile: Team ID and bundle ID match.')
          print('Provisioning profile: exact distribution certificate is included.')
          PY

      - name: Signing assets preflight passed
        run: echo "bIDE signing assets, profile identity, and certificate binding are valid before paid macOS use."
