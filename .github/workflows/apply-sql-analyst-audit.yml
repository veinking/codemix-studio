name: Apply SQL Analyst Audit

on:
  push:
    branches: [agent/bide-sql-analyst-audit]
    paths:
      - .github/workflows/apply-sql-analyst-audit.yml
      - scripts/apply-sql-analyst-audit.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/bide-sql-analyst-audit
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply SQL analyst fixes
        run: python scripts/apply-sql-analyst-audit.py
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit -p tsconfig.app.json
      - name: SQL regression guard
        run: npm run test:sql-analyst
      - name: Production build
        run: npm run build
      - name: Commit audited SQL workflow
        shell: bash
        run: |
          git rm .github/workflows/apply-sql-analyst-audit.yml scripts/apply-sql-analyst-audit.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Wire CSV-backed SQL analyst workflow"
          git push origin HEAD:agent/bide-sql-analyst-audit
