name: bIDE RC Source Preflight

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Exact 40-character PR #70 candidate SHA
        required: true
        default: "0da0141d93b9dcc050619266d2e429a33f2543e3"
        type: string

permissions:
  contents: read

concurrency:
  group: bide-rc-preflight-${{ inputs.source_ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate immutable candidate request
        shell: bash
        env:
          SOURCE_REF: ${{ inputs.source_ref }}
        run: |
          set -euo pipefail
          if [[ ! "${SOURCE_REF}" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "source_ref must be the exact 40-character PR #70 candidate SHA." >&2
            exit 1
          fi

      - name: Check out exact release candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}
          fetch-depth: 1

      - name: Verify exact source identity
        shell: bash
        run: |
          set -euo pipefail
          ACTUAL_SHA="$(git rev-parse HEAD)"
          echo "Source ref: ${{ inputs.source_ref }}"
          echo "Source SHA: ${ACTUAL_SHA}"
          [[ "${ACTUAL_SHA}" == "${{ inputs.source_ref }}" ]]
          test -z "$(git status --porcelain)"

      - name: Generate deterministic App Store icon
        run: node scripts/generate-bide-appicon.mjs

      - name: Validate Phase 1 baseline
        run: node scripts/validate-bide-ios-phase1.mjs

      - name: Validate Phase 2 data + SQL
        run: node scripts/validate-bide-ios-phase2.mjs

      - name: Validate Phase 2 integrity cleanup
        run: node scripts/validate-bide-ios-phase2-integrity.mjs

      - name: Validate TestFlight release configuration
        run: node scripts/validate-bide-ios-testflight.mjs
