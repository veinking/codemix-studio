name: bIDE TestFlight Checkpoint

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Exact merged RC commit SHA from agent/bide-ios-testflight-rc2
        required: true
        default: ""
        type: string
      tested_ref:
        description: Exact pre-merge SHA that passed bIDE RC Native XCTest
        required: true
        default: "0da0141d93b9dcc050619266d2e429a33f2543e3"
        type: string
      build_number:
        description: Unique App Store Connect build number 13 or greater
        required: true
        default: "13"
        type: string
      confirm:
        description: Type UPLOAD to sign and upload this build to TestFlight
        required: true
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: bide-testflight-${{ inputs.source_ref }}-${{ inputs.build_number }}
  cancel-in-progress: false

jobs:
  source-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Validate immutable release request
        shell: bash
        env:
          SOURCE_REF: ${{ inputs.source_ref }}
          TESTED_REF: ${{ inputs.tested_ref }}
          BUILD_NUMBER: ${{ inputs.build_number }}
        run: |
          set -euo pipefail
          for value in "${SOURCE_REF}" "${TESTED_REF}"; do
            if [[ ! "${value}" =~ ^[0-9a-fA-F]{40}$ ]]; then
              echo "source_ref and tested_ref must both be exact 40-character commit SHAs." >&2
              exit 1
            fi
          done
          if [[ ! "${BUILD_NUMBER}" =~ ^[1-9][0-9]*$ ]]; then
            echo "build_number must be a positive integer." >&2
            exit 1
          fi
          if (( 10#${BUILD_NUMBER} <= 12 )); then
            echo "build_number must be 13 or greater because App Store Connect already has build 12." >&2
            exit 1
          fi
          if [[ "${GITHUB_RUN_ATTEMPT}" != "1" ]]; then
            echo "TestFlight reruns are blocked. Start a fresh dispatch at the current exact RC SHA." >&2
            exit 1
          fi

      - name: Check out exact merged RC
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}
          fetch-depth: 0

      - name: Verify RC identity and tested native source
        shell: bash
        env:
          SOURCE_REF: ${{ inputs.source_ref }}
          TESTED_REF: ${{ inputs.tested_ref }}
        run: |
          set -euo pipefail
          ACTUAL_SHA="$(git rev-parse HEAD)"
          RC_HEAD="$(git ls-remote --heads origin refs/heads/agent/bide-ios-testflight-rc2 | awk '{print $1}')"
          echo "Requested merged RC: ${SOURCE_REF}"
          echo "Checked-out SHA: ${ACTUAL_SHA}"
          echo "Current RC2 head: ${RC_HEAD}"
          echo "XCTest-proven source: ${TESTED_REF}"
          [[ "${ACTUAL_SHA}" == "${SOURCE_REF}" ]]
          [[ "${RC_HEAD}" == "${SOURCE_REF}" ]]
          test -z "$(git status --porcelain)"

          if ! git cat-file -e "${TESTED_REF}^{commit}" 2>/dev/null; then
            git fetch --no-tags --depth=1 origin "${TESTED_REF}"
          fi
          git cat-file -e "${TESTED_REF}^{commit}"

          if ! git diff --quiet "${TESTED_REF}" "${SOURCE_REF}" -- ios scripts/generate-bide-appicon.mjs; then
            echo "The merged RC changed native iOS source or release assets after XCTest. Run Native XCTest on the merged source before uploading." >&2
            git diff --stat "${TESTED_REF}" "${SOURCE_REF}" -- ios scripts/generate-bide-appicon.mjs >&2 || true
            exit 1
          fi
          echo "Merged RC native source exactly matches the XCTest-proven candidate."

      - name: Generate deterministic App Store icon
        run: node scripts/generate-bide-appicon.mjs

      - name: Require generated release assets to be committed
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code -- ios/BideApp/Assets.xcassets/AppIcon.appiconset

      - name: Validate Phase 1 native scope
        run: node scripts/validate-bide-ios-phase1.mjs

      - name: Validate Phase 2 data and SQL
        run: node scripts/validate-bide-ios-phase2.mjs

      - name: Validate generation-4 data integrity
        run: node scripts/validate-bide-ios-phase2-integrity.mjs

      - name: Validate canonical XLSX fixture
        run: node scripts/validate-bide-ios-multisheet-fixture.mjs

      - name: Validate hardware regression coverage
        run: node scripts/validate-bide-ios-hardware-regressions.mjs

      - name: Validate basic App Store source configuration
        shell: bash
        run: |
          set -euo pipefail
          test -f ios/BideApp/PrivacyInfo.xcprivacy
          test -f ios/BideApp/Assets.xcassets/AppIcon.appiconset/AppIcon-1024.png
          grep -q 'PRODUCT_BUNDLE_IDENTIFIER: com.bideide.ios' ios/project.yml
          grep -Eq 'MARKETING_VERSION: [0-9]+\.[0-9]+\.[0-9]+' ios/project.yml
          grep -q 'ITSAppUsesNonExemptEncryption: false' ios/project.yml

  upload-testflight:
    needs: source-preflight
    if: ${{ inputs.confirm == 'UPLOAD' && github.run_attempt == 1 }}
    runs-on: macos-26
    timeout-minutes: 45
    env:
      APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      IOS_DISTRIBUTION_CERTIFICATE_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_BASE64 }}
      IOS_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
      BIDE_IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.BIDE_IOS_PROVISIONING_PROFILE_BASE64 }}
      KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
      BIDE_REQUESTED_BUILD: ${{ inputs.build_number }}
      ARCHIVE_PATH: ${{ github.workspace }}/build/TestFlight/bIDE.xcarchive
      EXPORT_PATH: ${{ github.workspace }}/build/TestFlight/export
      LOG_PATH: ${{ github.workspace }}/build/TestFlight/logs

    steps:
      - name: Check out exact merged RC
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}
          fetch-depth: 1

      - name: Verify exact source identity
        shell: bash
        run: |
          set -euo pipefail
          ACTUAL_SHA="$(git rev-parse HEAD)"
          echo "Source ref: ${{ inputs.source_ref }}"
          echo "Source SHA: ${ACTUAL_SHA}"
          [[ "${ACTUAL_SHA}" == "${{ inputs.source_ref }}" ]]
          test -z "$(git status --porcelain)"

      - name: Select App Store compatible Xcode
        shell: bash
        run: |
          set -euo pipefail
          XCODE_PATH="/Applications/Xcode.app/Contents/Developer"
          test -d "${XCODE_PATH}"
          sudo xcode-select --switch "${XCODE_PATH}"
          XCODE_VERSION="$(xcodebuild -version | awk 'NR == 1 { print $2}')"
          XCODE_MAJOR="${XCODE_VERSION%%.*}"
          if (( XCODE_MAJOR < 26 )); then
            echo "Xcode 26 or later is required; found ${XCODE_VERSION}." >&2
            exit 1
          fi
          xcodebuild -version
          echo "iOS SDK: $(xcrun --sdk iphoneos --show-sdk-version)"

      - name: Generate deterministic App Store icon
        run: node scripts/generate-bide-appicon.mjs

      - name: Require generated release assets to be committed
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code -- ios/BideApp/Assets.xcassets/AppIcon.appiconset

      - name: Validate Apple automation secrets
        shell: bash
        run: |
          set -euo pipefail
          for variable in \
            APP_STORE_CONNECT_KEY_ID \
            APP_STORE_CONNECT_ISSUER_ID \
            APP_STORE_CONNECT_PRIVATE_KEY \
            APPLE_TEAM_ID \
            IOS_DISTRIBUTION_CERTIFICATE_BASE64 \
            IOS_DISTRIBUTION_CERTIFICATE_PASSWORD \
            BIDE_IOS_PROVISIONING_PROFILE_BASE64 \
            KEYCHAIN_PASSWORD; do
            if [[ -z "${!variable:-}" ]]; then
              echo "Missing required Actions secret: ${variable}" >&2
              exit 1
            fi
          done

      - name: Read release version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(awk '/MARKETING_VERSION:/ {print $2; exit}' ios/project.yml)"
          BUILD="${BIDE_REQUESTED_BUILD}"
          [[ "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "${BUILD}" =~ ^[1-9][0-9]*$ ]]
          (( 10#${BUILD} > 12 ))
          echo "BIDE_VERSION=${VERSION}" >> "${GITHUB_ENV}"
          echo "BIDE_BUILD=${BUILD}" >> "${GITHUB_ENV}"
          echo "Candidate: ${VERSION} (${BUILD})"

      - name: Install App Store Connect API key
        shell: bash
        run: |
          set -euo pipefail
          KEY_PATH="${RUNNER_TEMP}/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"
          export KEY_PATH
          python3 - <<'PY'
          import os
          from pathlib import Path

          value = os.environ['APP_STORE_CONNECT_PRIVATE_KEY']
          if '\\n' in value and '\n' not in value:
              value = value.replace('\\n', '\n')
          if not value.endswith('\n'):
              value += '\n'
          Path(os.environ['KEY_PATH']).write_text(value, encoding='utf-8')
          PY
          chmod 600 "${KEY_PATH}"
          grep -q -- "-----BEGIN PRIVATE KEY-----" "${KEY_PATH}"
          grep -q -- "-----END PRIVATE KEY-----" "${KEY_PATH}"
          echo "ASC_KEY_PATH=${KEY_PATH}" >> "${GITHUB_ENV}"

      - name: Install signing certificate and bIDE profile
        shell: bash
        run: |
          set -euo pipefail
          CERTIFICATE_PATH="${RUNNER_TEMP}/bIDE_Distribution.p12"
          PROFILE_PATH="${RUNNER_TEMP}/bIDE_App_Store.mobileprovision"
          PROFILE_PLIST="${RUNNER_TEMP}/bIDE_App_Store.plist"
          KEYCHAIN_PATH="${RUNNER_TEMP}/bide-signing.keychain-db"
          export CERTIFICATE_PATH PROFILE_PATH

          python3 - <<'PY'
          import base64
          import os
          from pathlib import Path

          Path(os.environ['CERTIFICATE_PATH']).write_bytes(
              base64.b64decode(os.environ['IOS_DISTRIBUTION_CERTIFICATE_BASE64'], validate=True)
          )
          Path(os.environ['PROFILE_PATH']).write_bytes(
              base64.b64decode(os.environ['BIDE_IOS_PROVISIONING_PROFILE_BASE64'], validate=True)
          )
          PY

          security create-keychain -p "${KEYCHAIN_PASSWORD}" "${KEYCHAIN_PATH}"
          security set-keychain-settings -lut 21600 "${KEYCHAIN_PATH}"
          security unlock-keychain -p "${KEYCHAIN_PASSWORD}" "${KEYCHAIN_PATH}"
          security import "${CERTIFICATE_PATH}" -P "${IOS_DISTRIBUTION_CERTIFICATE_PASSWORD}" -A -t cert -f pkcs12 -k "${KEYCHAIN_PATH}"
          security set-key-partition-list -S apple-tool:,apple: -s -k "${KEYCHAIN_PASSWORD}" "${KEYCHAIN_PATH}"
          security list-keychains -d user -s "${KEYCHAIN_PATH}"
          security default-keychain -d user -s "${KEYCHAIN_PATH}"
          security find-identity -v -p codesigning "${KEYCHAIN_PATH}" | grep -q "Apple Distribution"

          security cms -D -i "${PROFILE_PATH}" > "${PROFILE_PLIST}"
          PROFILE_UUID="$(/usr/libexec/PlistBuddy -c 'Print :UUID' "${PROFILE_PLIST}")"
          PROFILE_NAME="$(/usr/libexec/PlistBuddy -c 'Print :Name' "${PROFILE_PLIST}")"
          PROFILE_TEAM_ID="$(/usr/libexec/PlistBuddy -c 'Print :TeamIdentifier:0' "${PROFILE_PLIST}")"
          PROFILE_APP_ID="$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "${PROFILE_PLIST}")"
          [[ "${PROFILE_TEAM_ID}" == "${APPLE_TEAM_ID}" ]]
          [[ "${PROFILE_APP_ID}" == "${APPLE_TEAM_ID}.com.bideide.ios" ]]

          mkdir -p "${HOME}/Library/MobileDevice/Provisioning Profiles"
          cp "${PROFILE_PATH}" "${HOME}/Library/MobileDevice/Provisioning Profiles/${PROFILE_UUID}.mobileprovision"
          {
            echo "KEYCHAIN_PATH=${KEYCHAIN_PATH}"
            echo "PROFILE_UUID=${PROFILE_UUID}"
            echo "PROFILE_NAME=${PROFILE_NAME}"
          } >> "${GITHUB_ENV}"
          echo "Installed profile: ${PROFILE_NAME} (${PROFILE_UUID})"

      - name: Install XcodeGen
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          xcodegen --version

      - name: Configure App Store signing and build number
        shell: bash
        run: |
          set -euo pipefail
          export PROJECT_YML="${GITHUB_WORKSPACE}/ios/project.yml"
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          path = Path(os.environ['PROJECT_YML'])
          text = path.read_text(encoding='utf-8')
          build_pattern = re.compile(r'(?m)^        CURRENT_PROJECT_VERSION: [0-9]+$')
          if len(build_pattern.findall(text)) != 1:
              raise SystemExit('Could not uniquely locate the bIDE application build-number setting.')
          text = build_pattern.sub(
              f"        CURRENT_PROJECT_VERSION: {os.environ['BIDE_REQUESTED_BUILD']}",
              text,
              count=1,
          )

          needle = '        PRODUCT_BUNDLE_IDENTIFIER: com.bideide.ios\n'
          if text.count(needle) != 1:
              raise SystemExit('Could not uniquely locate the bIDE application signing settings block.')
          signing = (
              needle
              + f"        DEVELOPMENT_TEAM: {os.environ['APPLE_TEAM_ID']}\n"
              + '        CODE_SIGN_STYLE: Manual\n'
              + '        CODE_SIGN_IDENTITY: Apple Distribution\n'
              + f"        PROVISIONING_PROFILE_SPECIFIER: {os.environ['PROFILE_UUID']}\n"
              + f"        OTHER_CODE_SIGN_FLAGS: \"--keychain {os.environ['KEYCHAIN_PATH']}\"\n"
          )
          path.write_text(text.replace(needle, signing, 1), encoding='utf-8')
          PY

      - name: Generate Xcode project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${LOG_PATH}"
          (
            cd ios
            xcodegen generate
          ) 2>&1 | tee "${LOG_PATH}/xcodegen.log"
          test -d ios/bIDE.xcodeproj

      - name: Create App Store export options
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${EXPORT_PATH}" "${LOG_PATH}"
          cat > build/TestFlight/ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>destination</key><string>upload</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
            <key>method</key><string>app-store-connect</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>provisioningProfiles</key><dict><key>com.bideide.ios</key><string>${PROFILE_UUID}</string></dict>
            <key>stripSwiftSymbols</key><true/>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
            <key>uploadSymbols</key><true/>
          </dict></plist>
          EOF
          plutil -lint build/TestFlight/ExportOptions.plist

      - name: Archive signed bIDE candidate
        id: archive
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "${ARCHIVE_PATH}"
          xcodebuild \
            -project ios/bIDE.xcodeproj \
            -scheme bIDE \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "${ARCHIVE_PATH}" \
            clean archive 2>&1 | tee "${LOG_PATH}/archive.log"

      - name: Verify archived app
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH="${ARCHIVE_PATH}/Products/Applications/bIDE.app"
          INFO_PLIST="${APP_PATH}/Info.plist"
          test -d "${APP_PATH}"
          test -f "${INFO_PLIST}"
          test -f "${APP_PATH}/PrivacyInfo.xcprivacy"
          test -f "${APP_PATH}/Assets.car"
          test -f "${APP_PATH}/embedded.mobileprovision"

          BUNDLE_ID="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "${INFO_PLIST}")"
          VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "${INFO_PLIST}")"
          BUILD="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "${INFO_PLIST}")"
          [[ "${BUNDLE_ID}" == "com.bideide.ios" ]]
          [[ "${VERSION}" == "${BIDE_VERSION}" ]]
          [[ "${BUILD}" == "${BIDE_BUILD}" ]]
          {
            echo "Bundle ID: ${BUNDLE_ID}"
            echo "Version: ${VERSION}"
            echo "Build: ${BUILD}"
            echo "Provisioning profile embedded: yes"
          } | tee "${LOG_PATH}/archive-verification.txt"

      - name: Upload archive to App Store Connect
        id: upload
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -exportArchive \
            -archivePath "${ARCHIVE_PATH}" \
            -exportPath "${EXPORT_PATH}" \
            -exportOptionsPlist build/TestFlight/ExportOptions.plist \
            -authenticationKeyPath "${ASC_KEY_PATH}" \
            -authenticationKeyID "${APP_STORE_CONNECT_KEY_ID}" \
            -authenticationKeyIssuerID "${APP_STORE_CONNECT_ISSUER_ID}" \
            2>&1 | tee "${LOG_PATH}/export-upload.log"

      - name: Remove temporary signing assets
        if: ${{ always() }}
        shell: bash
        run: |
          if [[ -n "${PROFILE_UUID:-}" ]]; then
            rm -f "${HOME}/Library/MobileDevice/Provisioning Profiles/${PROFILE_UUID}.mobileprovision"
          fi
          if [[ -n "${KEYCHAIN_PATH:-}" ]]; then
            security delete-keychain "${KEYCHAIN_PATH}" || true
          fi

      - name: Summarize TestFlight attempt
        if: ${{ always() }}
        shell: bash
        run: |
          {
            echo "### bIDE TestFlight upload"
            echo "- Merged RC: \`${{ inputs.source_ref }}\`"
            echo "- XCTest-proven source: \`${{ inputs.tested_ref }}\`"
            echo "- Build: \`${{ inputs.build_number }}\`"
            echo "- Archive: \`${{ steps.archive.outcome || 'not-run' }}\`"
            echo "- Upload: \`${{ steps.upload.outcome || 'not-run' }}\`"
            echo "- Native XCTest is not repeated here because Ubuntu proved the merged RC native tree exactly matches the SHA that already passed the dedicated native checkpoint."
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload diagnostic logs
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: bIDE-TestFlight-${{ inputs.build_number }}-${{ github.run_id }}
          path: |
            build/TestFlight/logs
            build/TestFlight/ExportOptions.plist
          retention-days: 14
          if-no-files-found: ignore
