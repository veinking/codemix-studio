name: bIDE Last-Good Render Repair (temporary)

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/bide-last-good-render-v2-temp.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply deterministic recovery patch
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new, label):
              p = Path(path)
              source = p.read_text()
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one match in {path}, found {count}")
              p.write_text(source.replace(old, new))

          replace_once(
              "src/pages/IDE.tsx",
              "\n".join([
                  '      addToConsole(">>> Execution completed ✓");',
                  '      lastSuccessfulOutputRef.current = consoleOutputRef.current.slice();',
                  '      setLastSuccessfulOutput([]);',
                  '      previousRunSucceeded.current = true;',
              ]),
              "\n".join([
                  '      addToConsole(">>> Execution completed ✓");',
                  '      const successfulSnapshot = consoleOutputRef.current.slice();',
                  '      lastSuccessfulOutputRef.current = successfulSnapshot;',
                  '      setLastSuccessfulOutput(successfulSnapshot);',
                  '      previousRunSucceeded.current = true;',
              ]),
              "IDE successful snapshot",
          )

          replace_once(
              "src/components/ConsolePanel.tsx",
              "\n".join([
                  '  // IDE currently clears output at the beginning of every run. Preserve the',
                  '  // previous run only when it completed without an obvious error, so a failed',
                  "  // debug attempt cannot erase the user's last known-good console context.",
                  '  React.useEffect(() => {',
                  '    const previous = previousOutputRef.current;',
                  '    if (output.length === 0 && previous.length > 0) {',
                  '      if (manualClearRef.current) {',
                  '        manualClearRef.current = false;',
                  '      } else if (!previous.some(looksLikeError)) {',
                  '        setPreservedSuccessfulOutput(previous.slice());',
                  '      }',
                  '    }',
                  '    if (output.length > 0) manualClearRef.current = false;',
                  '    previousOutputRef.current = output;',
                  '  }, [output]);',
              ]),
              "\n".join([
                  '  // Snapshot successful output as soon as the run completes. Waiting until the',
                  '  // next run clears the console is timing-sensitive and can lose the previous',
                  '  // result when React batches state changes or the console subtree remounts.',
                  '  React.useEffect(() => {',
                  '    const completedSuccessfully = output.some((message) =>',
                  '      /execution completed\\s*✓/i.test(message.text),',
                  '    );',
                  '    if (completedSuccessfully) {',
                  '      setPreservedSuccessfulOutput(output.slice());',
                  '    }',
                  '    if (output.length > 0) manualClearRef.current = false;',
                  '    previousOutputRef.current = output;',
                  '  }, [output]);',
              ]),
              "Console successful snapshot effect",
          )

          replace_once(
              "src/components/ConsolePanel.tsx",
              '        {effectiveLastSuccessfulOutput.length > 0 && (',
              '        {effectiveLastSuccessfulOutput.length > 0 && displayedOutput.some(looksLikeError) && (',
              "Console last-good error gate",
          )

          replace_once(
              "scripts/check-run-recovery.mjs",
              "\n".join([
                  "assert.ok(ctx.lastSuccessfulOutputRef.current.some(message => message.text === 'last-good-output'), 'successful run must snapshot its console synchronously');",
                  'const goodPlot = ctx.plotData;',
              ]),
              "\n".join([
                  "assert.ok(ctx.lastSuccessfulOutputRef.current.some(message => message.text === 'last-good-output'), 'successful run must snapshot its console synchronously');",
                  "assert.ok(ctx.lastSuccessfulOutput.some(message => message.text === 'last-good-output'), 'successful run must publish the snapshot immediately for later failures');",
                  'const goodPlot = ctx.plotData;',
              ]),
              "Immediate last-good publication regression",
          )

          replace_once(
              "scripts/check-python-runtime-errors.mjs",
              "  [consolePanel.includes('previous.some(looksLikeError)'), 'Console must not replace last-good output with a failed run.'],",
              "\n".join([
                  "  [consolePanel.includes('/execution completed\\\\s*✓/i.test(message.text)'), 'Console must snapshot completed successful output immediately.'],",
                  "  [consolePanel.includes('displayedOutput.some(looksLikeError)'), 'Console must reveal last-good output when the current run is failing.'],",
              ]),
              "Console recovery source guards",
          )
          PY

          npm ci
          node scripts/check-run-recovery.mjs
          node scripts/check-python-runtime-errors.mjs

          git rm .github/workflows/bide-last-good-render-v2-temp.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/IDE.tsx src/components/ConsolePanel.tsx scripts/check-run-recovery.mjs scripts/check-python-runtime-errors.mjs
          git commit -m "Make last-good recovery rendering deterministic"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
