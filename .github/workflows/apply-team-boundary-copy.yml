name: Apply team boundary copy

on:
  push:
    branches:
      - agent/bide-team-handoff-audit
    paths:
      - .github/workflows/apply-team-boundary-copy.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/bide-team-handoff-audit
      - name: Patch exact stale claims
        run: |
          python3 - <<'PY'
          from pathlib import Path

          replacements = {
              Path('src/pages/IDE.tsx'): [
                  (
                      'Save and sync your coding sessions across devices',
                      'Save workspace snapshots and restore them across devices',
                  ),
              ],
              Path('src/pages/Features.tsx'): [
                  (
                      'Start from reusable examples or share code without making templates and collaboration permanent toolbar clutter.',
                      'Start from reusable examples or create unlisted code links without making templates and sharing permanent toolbar clutter.',
                  ),
              ],
          }

          for path, pairs in replacements.items():
              text = path.read_text()
              for old, new in pairs:
                  if old not in text:
                      if new in text:
                          continue
                      raise SystemExit(f'{path}: expected stale claim not found; refusing partial patch')
                  if text.count(old) != 1:
                      raise SystemExit(f'{path}: expected exactly one stale claim, found {text.count(old)}')
                  text = text.replace(old, new, 1)
              path.write_text(text)
          PY
      - name: Commit patch
        run: |
          if git diff --quiet; then
            echo "No patch needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/IDE.tsx src/pages/Features.tsx
          git commit -m "Align team and cloud copy with V1 behavior"
          git push origin HEAD:agent/bide-team-handoff-audit
