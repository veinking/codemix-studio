name: bIDE Quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate bIDE Focus V1
        run: node scripts/validate-bide-focus-v1.mjs
      - name: Validate bIDE Public Cleanup V1
        run: node scripts/validate-bide-public-cleanup-v1.mjs
      - name: Validate bIDE Auth Entry V1
        run: node scripts/validate-bide-auth-entry-v1.mjs
      - name: Typecheck
        run: npx tsc --noEmit -p tsconfig.app.json
      - name: Production build
        run: npm run build
