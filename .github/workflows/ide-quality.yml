name: bIDE Quality

on:
  pull_request:
    paths-ignore:
      - "ios/**"
      - "scripts/validate-bide-ios-phase1.mjs"
      - "scripts/release/build_bide_sideloadly_ipa.sh"
      - ".github/workflows/bide-ios-quality.yml"
      - ".github/workflows/ide-quality.yml"
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate bIDE Focus V1
        run: node scripts/validate-bide-focus-v1.mjs
      - name: Validate bIDE Public Cleanup V1
        run: node scripts/validate-bide-public-cleanup-v1.mjs
      - name: Typecheck
        run: npx tsc --noEmit -p tsconfig.app.json
      - name: Production build
        run: npm run build
