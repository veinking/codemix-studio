name: Apply CSV Run and Export UX

on:
  push:
    branches:
      - agent/bide-csv-run-export
    paths:
      - .github/workflows/apply-csv-run-export.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/bide-csv-run-export
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Apply CSV preview run/export fix
        run: |
          echo ' dWFyZCA9IFBhdGgoJ3NjcmlwdHMvY2hlY2stc3FsLWFuYWx5c3Qtd29ya2Zsb3cubWpzJykKZw== ' | base64 -d > /tmp/patch.py
          python /tmp/patch.py
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: SQL workflow regression guard
        run: npm run test:sql-analyst
      - name: Production build
        run: npm run build
      - name: Commit fix and remove helper
        run: |
          rm .github/workflows/apply-csv-run-export.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/IDE.tsx scripts/check-sql-analyst-workflow.mjs .github/workflows/apply-csv-run-export.yml
          git commit -m "Make CSV preview run and export consistent"
          git push origin HEAD:agent/bide-csv-run-export
