name: bIDE Dependency Repair Probe

on:
  pull_request:
    paths:
      - package.json
      - package-lock.json
      - .github/workflows/dependency-repair-probe.yml

permissions:
  contents: read

jobs:
  repair-lockfile:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'fix/bide-dependency-audit-20260909'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Apply proposed DOMPurify override in working tree
        run: |
          npm pkg set "overrides.dompurify=^3.4.13"
          npm install --package-lock-only
          npm ci
      - name: Print exact high-severity audit entries
        run: |
          npm audit --json > npm-audit.json || true
          node - <<'NODE'
          const fs = require('fs');
          const report = JSON.parse(fs.readFileSync('npm-audit.json', 'utf8'));
          const high = Object.entries(report.vulnerabilities || {})
            .filter(([, value]) => value.severity === 'high')
            .map(([name, value]) => ({
              name,
              severity: value.severity,
              isDirect: value.isDirect,
              via: value.via,
              effects: value.effects,
              range: value.range,
              fixAvailable: value.fixAvailable,
            }));
          console.log(JSON.stringify({ metadata: report.metadata, high }, null, 2));
          if (high.length !== 1) {
            console.error(`Expected exactly one remaining high advisory entry, found ${high.length}`);
            process.exit(1);
          }
          NODE
