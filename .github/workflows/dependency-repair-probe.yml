name: bIDE Dependency Repair Probe

on:
  pull_request:
    paths:
      - package.json
      - package-lock.json
      - .github/workflows/dependency-repair-probe.yml

permissions:
  contents: write

jobs:
  repair-lockfile:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'fix/bide-dependency-audit-20260909'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Apply minimal patched dependency graph in working tree
        run: |
          npm pkg set "overrides.dompurify=^3.4.13"
          npm install vite@6.4.3 --save-dev --save-exact --package-lock-only
          npm ci
      - name: Require no high-severity npm advisories
        run: npm audit --audit-level=high
      - name: Prove full bIDE production build
        run: npm run build
      - name: Commit tested dependency repair
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "Dependency repair already applied"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "Patch Vite and Monaco sanitizer dependencies"
          git push origin "HEAD:${{ github.head_ref }}"
