name: bIDE Dependency Repair Probe

on:
  pull_request:
    paths:
      - package.json
      - package-lock.json
      - .github/workflows/dependency-repair-probe.yml

permissions:
  contents: write

jobs:
  repair-lockfile:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'fix/bide-dependency-audit-20260909'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Apply non-breaking npm audit repair to lockfile
        run: npm audit fix --package-lock-only || true
      - name: Show remaining high-severity audit
        run: npm audit --audit-level=high || true
      - name: Commit repaired lockfile
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json already contains the safe repair"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "Apply non-breaking npm audit lockfile repair"
          git push origin "HEAD:${{ github.head_ref }}"
      - name: Upload repaired lockfile
        uses: actions/upload-artifact@v4
        with:
          name: repaired-package-lock
          path: package-lock.json
          if-no-files-found: error
