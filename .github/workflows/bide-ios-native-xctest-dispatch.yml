name: bIDE RC Native XCTest

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Exact 40-character PR #70 candidate SHA
        required: true
        default: "34e6789f239144fd009bd53e2b7241349d3045c3"
        type: string

permissions:
  contents: read

concurrency:
  group: bide-native-xctest-${{ inputs.source_ref }}
  cancel-in-progress: true

jobs:
  native-xctest:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - name: Validate immutable candidate request
        shell: bash
        env:
          SOURCE_REF: ${{ inputs.source_ref }}
        run: |
          set -euo pipefail
          if [[ ! "${SOURCE_REF}" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "source_ref must be the exact 40-character PR #70 candidate SHA." >&2
            exit 1
          fi
          if [[ "${GITHUB_RUN_ATTEMPT}" != "1" ]]; then
            echo "Native XCTest reruns are blocked. Start a fresh dispatch at the exact candidate SHA." >&2
            exit 1
          fi

      - name: Check out exact PR #70 candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}
          fetch-depth: 1

      - name: Verify exact PR #70 source identity
        shell: bash
        run: |
          set -euo pipefail
          ACTUAL_SHA="$(git rev-parse HEAD)"
          PR70_HEAD="$(git ls-remote --heads origin refs/heads/hotfix/ios-rc2-value-integrity-build12 | awk '{print $1}')"
          echo "Requested SHA: ${{ inputs.source_ref }}"
          echo "Checked-out SHA: ${ACTUAL_SHA}"
          echo "PR #70 head: ${PR70_HEAD}"
          [[ "${ACTUAL_SHA}" == "${{ inputs.source_ref }}" ]]
          [[ "${PR70_HEAD}" == "${ACTUAL_SHA}" ]]
          test -z "$(git status --porcelain)"

      - name: Generate deterministic App Store icon
        run: node scripts/generate-bide-appicon.mjs

      - name: Validate Phase 1 baseline
        run: node scripts/validate-bide-ios-phase1.mjs

      - name: Validate Phase 2 data + SQL
        run: node scripts/validate-bide-ios-phase2.mjs

      - name: Validate Phase 2 integrity cleanup
        run: node scripts/validate-bide-ios-phase2-integrity.mjs

      - name: Validate TestFlight release configuration
        run: node scripts/validate-bide-ios-testflight.mjs

      - name: Select Xcode
        shell: bash
        run: |
          set -euo pipefail
          XCODE_PATH="/Applications/Xcode.app/Contents/Developer"
          test -d "${XCODE_PATH}"
          sudo xcode-select --switch "${XCODE_PATH}"
          xcodebuild -version
          echo "iOS SDK: $(xcrun --sdk iphoneos --show-sdk-version)"

      - name: Install XcodeGen
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v xcodegen >/dev/null 2>&1; then brew install xcodegen; fi
          xcodegen --version

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Run native XCTest suite
        shell: bash
        run: |
          set -euo pipefail
          DEVICE_ID="$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); ids=[x["udid"] for xs in d["devices"].values() for x in xs if x.get("isAvailable") and x.get("name","").startswith("iPhone")]; print(ids[0] if ids else "")')"
          test -n "${DEVICE_ID}"
          xcodebuild -project ios/bIDE.xcodeproj -scheme bIDE -configuration Debug -sdk iphonesimulator -destination "platform=iOS Simulator,id=${DEVICE_ID}" CODE_SIGNING_ALLOWED=NO test
