name: Apply CSV workspace access fix

on:
  push:
    branches:
      - agent/bide-csv-workspace-access

permissions:
  contents: write

jobs:
  patch-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/bide-csv-workspace-access

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Apply focused workspace patch
        run: python scripts/apply-csv-workspace-access.py

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: CSV workspace regression
        run: npm run test:csv-workspace

      - name: Production build
        run: npm run build

      - name: Commit verified patch
        run: |
          rm scripts/apply-csv-workspace-access.py
          rm .github/workflows/apply-csv-workspace-access.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Make workspace CSVs first-class in Python and navigation"
          git push origin HEAD:agent/bide-csv-workspace-access
