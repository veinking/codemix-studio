name: bIDE iOS Runtime Finish Check

on:
  push:
    branches:
      - fix/bide-ios-native-runtimes-finish-20260913

permissions:
  contents: read

concurrency:
  group: bide-ios-runtime-finish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runtime-check:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Validate native source contracts
        run: |
          node scripts/validate-bide-ios-phase1.mjs
          node scripts/validate-bide-ios-phase2.mjs
          node scripts/validate-bide-ios-phase2-integrity.mjs
          node scripts/validate-bide-ios-runtimes.mjs

      - name: Select Xcode 16.4
        shell: bash
        run: |
          set -euo pipefail
          XCODE_PATH="/Applications/Xcode_16.4.app/Contents/Developer"
          test -d "${XCODE_PATH}"
          sudo xcode-select --switch "${XCODE_PATH}"
          xcodebuild -version

      - name: Install XcodeGen
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          xcodegen --version

      - name: Generate project and bundled runtimes
        working-directory: ios
        run: xcodegen generate

      - name: Run native Python R and SQL regression tests
        shell: bash
        run: |
          set -euo pipefail
          DEVICE_ID="$(xcrun simctl list devices available -j | python3 -c 'import json,sys; data=json.load(sys.stdin); ids=[d["udid"] for runtime in data["devices"].values() for d in runtime if d.get("isAvailable") and d.get("name","").startswith("iPhone")]; print(ids[0] if ids else "")')"
          test -n "${DEVICE_ID}"
          set -o pipefail
          xcodebuild \
            -project ios/bIDE.xcodeproj \
            -scheme bIDE \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "platform=iOS Simulator,id=${DEVICE_ID}" \
            CODE_SIGNING_ALLOWED=NO \
            test | tee /tmp/bide-ios-runtime-finish.log

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: bide-ios-runtime-finish-diagnostics
          path: /tmp/bide-ios-runtime-finish.log
          if-no-files-found: warn
          retention-days: 7
