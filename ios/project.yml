name: bIDE
options:
  bundleIdPrefix: com.bideide
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  CoreXLSX:
    url: https://github.com/CoreOffice/CoreXLSX.git
    exactVersion: 0.14.2

targets:
  bIDE:
    type: application
    platform: iOS
    sources:
      - path: BideApp
    resources:
      - path: BideApp/PrivacyInfo.xcprivacy
    dependencies:
      - package: CoreXLSX
        product: CoreXLSX
      - sdk: libsqlite3.tbd
    info:
      path: BideApp/Info.plist
      properties:
        CFBundleDisplayName: bIDE
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CFBundleDocumentTypes:
          - CFBundleTypeName: bIDE Project Files
            CFBundleTypeRole: Editor
            LSHandlerRank: Owner
            LSItemContentTypes:
              - public.python-script
              - com.bideide.sql-source
              - com.bideide.r-source
              - net.daringfireball.markdown
              - public.comma-separated-values-text
              - public.tab-separated-values-text
              - public.json
              - public.plain-text
              - org.openxmlformats.spreadsheetml.sheet
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: com.bideide.sql-source
            UTTypeDescription: SQL Source Code
            UTTypeConformsTo:
              - public.source-code
              - public.text
            UTTypeTagSpecification:
              public.filename-extension:
                - sql
          - UTTypeIdentifier: com.bideide.r-source
            UTTypeDescription: R Source Code
            UTTypeConformsTo:
              - public.source-code
              - public.text
            UTTypeTagSpecification:
              public.filename-extension:
                - r
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bideide.ios
        PRODUCT_NAME: bIDE
        MARKETING_VERSION: 0.2.6
        CURRENT_PROJECT_VERSION: 11
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO

  bIDETests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: BideTests
        excludes:
          - Fixtures
    resources:
      - path: BideTests/Fixtures
    dependencies:
      - target: bIDE
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bideide.ios.tests
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete

schemes:
  bIDE:
    build:
      targets:
        bIDE: all
        bIDETests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - bIDETests
    archive:
      config: Release
